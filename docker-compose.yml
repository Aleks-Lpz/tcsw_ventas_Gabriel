# P08. PostgreSQL 16 para el adaptador JDBC.
# Las credenciales NO viven en el repositorio: se leen de .env (ver .env.example).
services:
  postgres:
    image: postgres:16
    container_name: tcsw-ventas-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ventas}
      POSTGRES_USER: ${POSTGRES_USER:-ventas_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
